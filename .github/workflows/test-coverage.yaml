# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  pull_request:
    branches: [main, master]

name: test-coverage.yaml

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MOBILITY_DATABASE: ${{ secrets.MOBILITY_DATABASE }}

    permissions:
      contents: read
      pull-requests: write  # Required to post coverage comment on the PR

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::testthat, any::rosmium, local::.
          needs: coverage

      - name: Run tests and compute coverage
        run: |
          install_path <- file.path(
            normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package"
          )

          # Helper: print the .Rout.fail file so the actual test error is visible
          # in the CI log instead of just a path reference.
          dump_rout_fail <- function() {
            fail_files <- list.files(install_path, pattern = "\\.Rout\\.fail$",
                                     recursive = TRUE, full.names = TRUE)
            if (length(fail_files) == 0) {
              message("No .Rout.fail file found.")
              return(invisible(NULL))
            }
            for (f in fail_files) {
              message("\n========== ", basename(f), " ==========")
              cat(readLines(f, warn = FALSE), sep = "\n")
              message("============================================\n")
            }
          }

          cov <- tryCatch(
            covr::package_coverage(
              quiet = FALSE,
              clean = FALSE,
              install_path = install_path
            ),
            error = function(e) {
              message("\n--- Test suite failed. Dumping .Rout.fail for diagnosis ---\n")
              dump_rout_fail()
              stop(e)   # re-throw so the job still fails
            }
          )

          # Save coverage object for later steps
          saveRDS(cov, "coverage.rds")

          # Print summary to the log
          print(cov)

          # Generate Cobertura XML report for upload
          covr::to_cobertura(cov, filename = "coverage.xml")

          # Compute total coverage percentage
          pct <- covr::percent_coverage(cov)
          message("Total coverage: ", round(pct, 2), "%")

          # Write percentage to GITHUB_ENV for use in subsequent steps
          writeLines(
            paste0("COVERAGE_PCT=", round(pct, 2)),
            Sys.getenv("GITHUB_ENV")
          )
        shell: Rscript {0}

      - name: Build per-file coverage report
        id: build_report
        run: |
          cov <- readRDS("coverage.rds")
          df  <- covr::coverage_to_list(cov)$filecoverage

          # Header
          lines <- c(
            "## 📊 Test Coverage Report",
            "",
            paste0("**Total coverage:** ", round(covr::percent_coverage(cov), 2), "%"),
            "",
            "| File | Coverage |",
            "|------|----------|"
          )

          # One row per file, sorted descending by coverage
          file_pcts <- vapply(df, function(x) {
            hits   <- sum(x > 0, na.rm = TRUE)
            total  <- sum(!is.na(x))
            if (total == 0) return(NA_real_)
            100 * hits / total
          }, numeric(1))

          order_idx  <- order(file_pcts, na.last = TRUE)
          file_names <- names(df)[order_idx]
          file_pcts  <- file_pcts[order_idx]

          for (i in seq_along(file_names)) {
            pct  <- file_pcts[i]
            icon <- if (is.na(pct))        "⚪"  else
                    if (pct >= 80)         "🟢"  else
                    if (pct >= 50)         "🟡"  else "🔴"
            label <- if (is.na(pct)) "N/A" else paste0(round(pct, 1), "%")
            lines <- c(lines, paste0("| `", basename(file_names[i]), "` | ", icon, " ", label, " |"))
          }

          lines <- c(lines, "", "_Generated by [covr](https://covr.r-lib.org/)_")

          # Escape newlines for GITHUB_OUTPUT
          body <- paste(lines, collapse = "\n")
          body_escaped <- gsub("\n", "%0A", body)
          cat(paste0("body=", body_escaped, "\n"), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-coverage
          message: ${{ steps.build_report.outputs.body }}

      - name: Upload Cobertura XML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Enforce minimum coverage threshold
        run: |
          pct <- as.numeric(Sys.getenv("COVERAGE_PCT"))
          threshold <- 0   # Set your desired minimum coverage % here (e.g. 60)
          if (!is.na(pct) && pct < threshold) {
            stop(paste0(
              "Coverage (", round(pct, 2), "%) is below the required threshold of ",
              threshold, "%."
            ))
          } else {
            message("Coverage check passed: ", round(pct, 2), "%")
          }
        shell: Rscript {0}

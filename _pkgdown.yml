url: https://u-shift.github.io/GTFShift/
template:
  bootstrap: 5

reference:
  - title: Read
    contents:
    - load_feed
  - title: Filter
    contents:
    - starts_with("filter_")
  - title: Analyse
    contents:
    - starts_with("get_")
    - network_overline
  - title: Manipulate
    contents:

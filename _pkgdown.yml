url: https://u-shift.github.io/GTFShift/
template:
  bootstrap: 5

reference:
  - title: Get GTFS feeds
    contents:
    - load_feed
    - query_mobilitydatabase
  - title: Filter
    contents:
    - starts_with("filter_")
  - title: Analyse
    contents:
    - starts_with("get_")
    - network_overline
  - title: Manipulate
    contents:
    - unify
    - starts_with("create_")
  - title: Open Street Maps
    contents:
    - starts_with("osm_")
articles:
  - title: Articles
    navbar: ~
    contents:
    - download
    - filter
    - unify
    - analyse
    - osm

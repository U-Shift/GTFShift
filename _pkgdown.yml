url: https://u-shift.github.io/GTFShift/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "#15AF97FF"

navbar:
  structure:
   left:  [intro, reference, articles, dashboard]

  components:
    dashboard:
      text: "Bus lane prioritisation dashboard"
      href: "https://ushift.tecnico.ulisboa.pt/apps/gtfshift/"
      target: "_blank"


reference:
  - title: Get GTFS feeds
    contents:
    - load_feed
    - query_mobilitydatabase
  - title: Prioritise for bus lane implementation
    contents:
    - starts_with("prioritise_")
    - rt_extend_prioritisation
    - get_prioritisation_stats
  - title: Filter
    contents:
    - starts_with("filter_")
  - title: Analyse
    contents:
    - starts_with("get_")
    - network_overline
  - title: Classify
    contents:
    - starts_with("classify_")
  - title: Manipulate
    contents:
    - unify
    - starts_with("create_")
    - starts_with("build_")
  - title: OpenStreetMaps
    contents:
    - starts_with("osm_")
  - title: Realtime
    contents:
    - starts_with("rt_")
  - title: Utils
    contents:
    - calendar_nextBusinessWednesday
    - multiline_to_sorted_linestring
    - project_points_along_geometry
articles:
  - title: Articles
    navbar: ~
    contents:
    - articles/prioritise
    - articles/download
    - articles/filter
    - articles/unify
    - articles/analyse
    - articles/classify
    - articles/osm
    - articles/rt
    - articles/osm_update
    - articles/gtfs_from_osm

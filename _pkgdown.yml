url: https://u-shift.github.io/GTFShift/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "#15AF97FF"

navbar:
  structure:
   left:  [intro, reference, articles, dashboard]

  components:
    dashboard:
      text: "Dashboard"
      href: "https://ushift.pt/apps/gtfshift"
      target: "_blank"


reference:
  - title: Get GTFS feeds
    contents:
    - load_feed
    - query_mobilitydatabase
  - title: Prioritize
    contents:
    - starts_with("prioritize_")
    - rt_extend_prioritization
    - get_prioritization_stats
  - title: Filter
    contents:
    - starts_with("filter_")
  - title: Analyse
    contents:
    - starts_with("get_")
    - network_overline
  - title: Classify
    contents:
    - starts_with("classify_")
  - title: Manipulate
    contents:
    - unify
    - starts_with("create_")
    - starts_with("build_")
  - title: OpenStreetMaps
    contents:
    - starts_with("osm_")
  - title: Realtime
    contents:
    - starts_with("rt_")
  - title: Utils
    contents:
    - calendar_nextBusinessWednesday
articles:
  - title: Articles
    navbar: ~
    contents:
    - prioritize
    - download
    - filter
    - unify
    - analyse
    - classify
    - osm
    - rt
    - osm_update
